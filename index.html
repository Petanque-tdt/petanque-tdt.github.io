<!doctype html>
<html lang="fr" data-skin="B">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Pétanque 2026</title>
<style>
/* Mise en page : mobile d'abord, colonne unique 640px, barre d'onglets en bas pour le pouce.
   Chartes (data-skin) : A EPoS · B Fribourg · C Boulodrome · D Lampions · E Plein soleil */
:root{--bg:#E9E6DF;--fg:#23262B;--muted:#5E6268;--head:#4E5A22;--headfg:#F3F1EA;--card:#F6F4EF;--cardline:1px solid #D6D1C5;--soft:#DCE1C6;--line:#CFC9BC;--primary:#6B7A2A;--primaryfg:#FFFFFF;--accent:#8A939B;--accentfg:#FFFFFF;--btnbg:#6B7A2A;--btnfg:#FFFFFF;--btnr:10px;--r:12px;--font:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;--hw:700;--ls:0;--tt:none;--ok:#2E7D32;--warn:#B26A00;--bad:#C62828;color-scheme:light}
[data-skin="A"]{--bg:#FFFFFF;--fg:#0E2841;--muted:#31475D;--head:#0E2841;--headfg:#FFFFFF;--card:#FFFFFF;--cardline:1px solid #E8E8E8;--soft:#E7F4FB;--line:#E8E8E8;--primary:#3FA8E0;--primaryfg:#FFFFFF;--accent:#E97132;--accentfg:#FFFFFF;--btnbg:transparent;--btnfg:#156082;--btnr:999px;--r:0 14px 14px 0;--font:Calibri,Carlito,"Segoe UI",sans-serif;--hw:300;--ls:.08em;--tt:uppercase}
[data-skin="B"]{--bg:#FFFFFF;--fg:#111111;--muted:#5A5A5A;--head:#111111;--headfg:#FFFFFF;--card:#F4F4F4;--cardline:0;--soft:#EBEBEB;--line:#DADADA;--primary:#111111;--primaryfg:#FFFFFF;--accent:#C8102E;--accentfg:#FFFFFF;--btnbg:#111111;--btnfg:#FFFFFF;--btnr:4px;--r:4px;--font:"Helvetica Neue",Arial,sans-serif;--hw:800;--ls:.02em;--tt:none}
[data-skin="D"]{--bg:#0F1B2D;--fg:#EEF1F6;--muted:#9AA7BA;--head:#0A1322;--headfg:#F5B83D;--card:#17263D;--cardline:1px solid #23395A;--soft:#22344F;--line:#2A4060;--primary:#F5B83D;--primaryfg:#0F1B2D;--accent:#F5B83D;--accentfg:#0F1B2D;--btnbg:#F5B83D;--btnfg:#0F1B2D;--btnr:999px;--r:14px;--font:system-ui,"Segoe UI",sans-serif;--hw:700;--ls:.01em;--tt:none;--ok:#66BB6A;--warn:#FFB74D;--bad:#EF5350;color-scheme:dark}
[data-skin="E"]{--bg:#FFFFFF;--fg:#000000;--muted:#3D3D3D;--head:#FFD400;--headfg:#000000;--card:#FFFFFF;--cardline:3px solid #000000;--soft:#FFF3A6;--line:#000000;--primary:#000000;--primaryfg:#FFD400;--accent:#000000;--accentfg:#FFD400;--btnbg:#000000;--btnfg:#FFD400;--btnr:0;--r:0;--font:Arial,sans-serif;--hw:900;--ls:.04em;--tt:uppercase}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--headfg);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:var(--hw);letter-spacing:var(--ls);text-transform:var(--tt);font-size:1.05rem}
.brand small{display:block;font-weight:400;font-size:.72rem;opacity:.8;letter-spacing:0;text-transform:none}
.lang{display:flex;border:1px solid currentColor;border-radius:999px;overflow:hidden;font-size:.78rem}
.lang button{background:none;border:0;padding:5px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--headfg);color:var(--head)}
main{max-width:640px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;padding:12px 4px 10px;font-size:.8rem;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--fg);font-weight:700;border-top-color:var(--primary)}
h2{font-size:1.15rem;margin:0;font-weight:var(--hw);letter-spacing:var(--ls);text-transform:var(--tt);text-wrap:balance}
h3{font-size:1rem;margin:0 0 8px}
.card{background:var(--card);border:var(--cardline);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-block;background:var(--accent);color:var(--accentfg);font-size:.75rem;padding:3px 10px;border-radius:999px;font-weight:600}
.chip.soft{background:var(--soft);color:var(--fg)}
.chip.ok{background:var(--ok);color:#fff}.chip.warn{background:var(--warn);color:#fff}.chip.bad{background:var(--bad);color:#fff}
.big{font-size:1.6rem;font-weight:var(--hw)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs>div:last-child{text-align:right}
.vs b{display:block}
.names{font-size:.82rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:var(--btnr);font-weight:700;letter-spacing:var(--ls);text-transform:var(--tt);background:var(--btnbg);color:var(--btnfg);border:2px solid var(--primary);cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.full{width:100%}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.stepper{display:flex;flex-direction:column;align-items:center;gap:6px}
.stepper .val{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;width:3.2ch;min-width:84px;text-align:center;padding:6px 4px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);-moz-appearance:textfield}
.stepper .val::-webkit-outer-spin-button,.stepper .val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .val:focus{border-color:var(--primary);outline:none}
.stepper .ctl{display:flex;gap:8px}
.stepper .ctl button{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-size:1.4rem;cursor:pointer}
.clock{font-variant-numeric:tabular-nums;font-size:2rem;font-weight:800}
.clock.over{color:var(--bad)}
input[type=text],input[type=number],input[type=search],input[type=password],input[type=time],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
textarea{min-height:110px}
.list{display:flex;flex-direction:column}
.list>*{padding:10px 0;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.88rem}
th{white-space:nowrap;text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 4px;font-weight:600}
td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right}
tr.me td{background:var(--soft);font-weight:700}
tr.click{cursor:pointer}
tr.click:hover td,tr.click:active td{background:var(--soft)}
td.go{font-size:1.5rem;line-height:1;color:var(--muted);padding-left:2px;padding-right:0;vertical-align:middle;text-align:right}
.hint{margin:0;padding:8px 12px;border-radius:8px;background:var(--soft);font-size:.85rem;font-weight:600}
.rk{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--primaryfg);font-size:.72rem;font-weight:700;padding:0 4px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet>.card{width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.rules h3{margin-top:6px}.rules ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-size:.85rem}
.pchip.sel{border-color:var(--primary);background:var(--soft);font-weight:700}
.pchip .x{border:0;background:none;color:var(--bad);cursor:pointer;font-weight:700;padding:0 2px}
.dots{display:flex;gap:4px;margin-top:5px}
.legend{margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.w{background:var(--ok)}.dot.l{background:var(--bad)}
.dot.pend{background:transparent;border:2px solid var(--muted);width:9px;height:9px}
.dot.bye{background:transparent;border:2px solid var(--ok);width:9px;height:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:20;font-size:.9rem;max-width:90vw}
.banner{background:var(--warn);color:#fff;padding:8px 16px;font-size:.85rem;text-align:center}
details>summary{cursor:pointer;font-weight:700;padding:4px 0}
@media (prefers-reduced-motion:no-preference){.card{transition:background .2s}}

/* ===== Tableau de bord organisateur (?gestion) : portable, tout sur une page ===== */
html.gestion body{padding-bottom:0;font-size:13px}
html.gestion .tabs{display:none}
html.gestion main{max-width:none;padding:10px 14px;gap:10px}
.g-top{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;background:var(--card);border:var(--cardline);border-radius:var(--r);padding:10px 14px}
.g-top b{font-size:1.1rem}.g-phase{color:var(--accent)}
.g-clock{font-size:1.6rem}
.g-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.g-actions .btn,.g-actions a.btn{text-decoration:none}
.g-grid{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2.4fr) minmax(0,1.6fr);gap:10px;align-items:start}
.g-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.g-col .card{padding:10px 12px;gap:6px}
.g-col h3{margin:0}
.g-list{max-height:46vh;overflow:auto;display:flex;flex-direction:column}
.g-list>div{padding:4px 0;border-top:1px solid var(--line)}
.g-tbl,.g-rank{font-size:12px}
.g-tbl td,.g-rank td{padding:4px 4px}
.g-tbl th{padding:4px}
.g-in{width:46px!important;min-height:30px!important;padding:3px 4px!important;text-align:center;font-weight:700}
.g-btns{white-space:nowrap}.g-btns .btn{min-height:28px;padding:3px 8px;font-size:.75rem}
.g-tbl tr.g-bad td{background:rgba(200,16,46,.10)}
.g-tbl tr.g-ok td{opacity:.65}
.g-tbl .chip{white-space:nowrap}
html.gestion .top{padding-block:6px}html.gestion .brand small{display:none}
.g-rank td.c-rk{font-weight:800;color:var(--accent);width:24px}
.g-rank .dots{margin:0}.g-rank .dot{width:9px;height:9px}
.memo{border-top:1px solid var(--line);padding:6px 0}
.memo summary{font-weight:800;font-size:.95rem}
.memo ul,.memo ol{margin:6px 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.4}
.memo p{margin:4px 0}
.memo .btn{margin:4px 0}
.prompter{position:fixed;inset:0;z-index:50;background:#fff;color:#111;padding:20px 4vw 30px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.pr-bar{position:sticky;top:-20px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;border-bottom:2px solid #111}
.pr-pos{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.pr-title{font-size:2.6rem;margin:6px 0 0;color:#C8102E;text-transform:none;letter-spacing:0}
.pr-list{margin:0;padding-left:3.2rem;display:flex;flex-direction:column;gap:18px;font-size:2.1rem;line-height:1.35}
.pr-list li{cursor:pointer;color:#6b6b6b;transition:color .2s}
.pr-list li.done{color:#bdbdbd}
.pr-list li.cur{color:#111;font-size:2.6rem;background:#fff4c2;border-radius:10px;padding:8px 14px;margin-left:-14px}
.pr-list li::marker{font-weight:800}
.pr-after{font-size:1.5rem;font-weight:700;border-top:2px solid #ddd;padding-top:12px;margin:8px 0 0}
.pr-help{color:#777;font-size:1rem;margin:0}
@media (prefers-reduced-motion:reduce){.pr-list li{transition:none}}
.g-teams{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 14px;font-size:12px}
@media (max-width:1100px){.g-grid{grid-template-columns:1fr 1fr}.g-col:last-child{grid-column:1/-1}}
/* ===== Écran géant (?ecran) : fond blanc pour projecteur, gros caractères, sans navigation ===== */
html.screen body{background:#ffffff;color:#111111;padding:0;font-size:1.25vw;overflow:hidden}
html.screen .top,html.screen .tabs,html.screen #banner,html.screen .toast{display:none!important}
html.screen main{max-width:none;padding:1.4vw 2vw;height:100vh;display:block}
.scr{height:calc(100vh - 2.8vw);display:flex;gap:2vw;color:#111}
.scr h1{font-size:3.2vw;margin:0;font-weight:800;letter-spacing:.01em}
.scr h1 small{font-size:1.8vw;color:#666;font-weight:600}
.scr h2{font-size:1.4vw;margin:1vw 0 .5vw;text-transform:uppercase;letter-spacing:.08em;color:#555}
.scr .muted{color:#666}
.scr-left{flex:0 0 32%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1vw;border-right:.35vw solid #C8102E;padding-right:2vw}
.scr-lead{font-size:2.2vw;margin:0;line-height:1.25}.scr-sub{font-size:1.3vw;color:#555;margin:0}
.scr-qr{display:flex;flex-direction:column;align-items:center;gap:.5vw}
.scr-qr img{width:17vw;height:17vw;background:#fff;padding:.6vw;border:.25vw solid #111;border-radius:.6vw;image-rendering:pixelated}
.scr-url{font-size:1.3vw;font-weight:700}
.scr-right{flex:1;min-width:0;overflow:hidden}
.scr-count{font-size:2.4vw}.scr-count .big-n{font-size:6vw;font-weight:800;color:#111}
.scr-bar{height:1vw;background:#e3e3e3;border-radius:1vw;overflow:hidden}.scr-bar i{display:block;height:100%;background:#1B7A2E}
.scr-recent{display:flex;flex-wrap:wrap;gap:.5vw 1.5vw;font-size:1.3vw;color:#1B7A2E;font-weight:600}
.scr-recent small,.scr-miss small{color:#777;font-size:.75em;font-weight:400}
.scr-miss{columns:3;column-gap:2vw;font-size:1.3vw;line-height:1.55}
.scr-miss.dense{columns:4;font-size:1.05vw}
.scr-miss span{display:block;break-inside:avoid}
.scr-teams,.scr-final{flex-direction:column}
.scr-teams .scr-qr{position:fixed;right:2vw;bottom:2vw}.scr-teams .scr-qr img{width:10vw;height:10vw}
.scr-head p{margin:.3vw 0 0;font-size:1.4vw;color:#444}
.scr-tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5vw 2vw;font-size:1.25vw;padding-right:13vw}
.scr-tgrid b{color:#C8102E;margin-right:.4vw}
.scr-live{flex-direction:column}
.scr-live .scr-head{display:flex;justify-content:space-between;align-items:center}
.scr-clock .clock{font-size:4.6vw;font-weight:800;font-variant-numeric:tabular-nums;color:#111}
.scr-clock .clock.over{color:#C8102E}
.scr-body{flex:1;display:flex;gap:1.6vw;min-height:0}
.scr-matches{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;gap:.6vw;align-content:start}
.scr-m{background:#f1f1f1;border-left:.3vw solid #111;border-radius:.4vw;padding:.5vw .7vw;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;gap:.15vw .5vw;align-items:center;font-size:.95vw}
.scr-m.fin{border-left-color:#1B7A2E;background:#f7f7f7;color:#666}
.scr-t{grid-column:1/-1;font-weight:800;font-size:1vw;color:#C8102E}.scr-t small{color:#666;font-weight:600}
.scr-a{text-align:left}.scr-b{text-align:right}
.scr-m b{color:#111}
.sc{font-size:1.8vw;font-weight:800;font-variant-numeric:tabular-nums;padding:0 .4vw;border-radius:.3vw}
.sc.ok{color:#1B7A2E}.sc.live{color:#B85C00}.sc.bad{color:#C8102E}.sc.none{color:#bbb}
/* classement : 20 lignes sur une colonne, une ligne par équipe */
.scr-rank{flex:0 0 34%;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.scr-rank h2{margin-top:0}
.scr-rank table{font-size:.95vw;width:100%;border-collapse:collapse}
.scr-rank td{border-top:1px solid #ddd;padding:.22vw .3vw;vertical-align:middle;color:#111;white-space:nowrap}
.scr-rank tr:nth-child(-n+3) td{font-weight:700}
.scr-rank td.c-rk{width:2.2vw;text-align:center;font-weight:800;color:#C8102E}
.scr-rank td.c-tm{overflow:hidden;text-overflow:ellipsis;max-width:15vw}
.scr-rank td.n{text-align:right;font-variant-numeric:tabular-nums}
.scr-rank td.c-wl{font-weight:800}
.scr-rank .dots{margin:0;gap:.2vw}.scr-rank .dot{width:.75vw;height:.75vw}
.scr-rank .dot.pend,.scr-rank .dot.bye{width:.55vw;height:.55vw}
.scr .dot.w{background:#1B7A2E}.scr .dot.l{background:#C8102E}.scr .dot.pend{border-color:#888}
.scr-final .scr-rank{flex:1}
.scr-final .scr-rank table{font-size:1.05vw}
.scr-podium{display:flex;gap:2vw;justify-content:center;align-items:flex-end;margin:.8vw 0}
.pod{background:#f1f1f1;border-radius:.8vw;padding:1vw 2vw;text-align:center;display:flex;flex-direction:column;gap:.3vw;min-width:22vw}
.pod.p1{border:.35vw solid #D4A017;padding-block:1.8vw}.pod.p2{border:.35vw solid #9aa5ab}.pod.p3{border:.35vw solid #a8703e}
.pod-n{font-size:3.6vw;font-weight:800}.pod b{font-size:1.7vw}.pod small{color:#555}
</style>
</head>
<body>
<div id="banner" class="banner" hidden></div>
<header class="top">
  <div class="brand" id="brand">Pétanque 2026<small id="sub"></small></div>
  <div class="lang" role="group" aria-label="Langue / Language">
    <button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs"></nav>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
